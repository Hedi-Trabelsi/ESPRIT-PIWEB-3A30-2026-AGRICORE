doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        # Backtrace collection is the single biggest dev-mode slowdown for Doctrine —
        # it captures a full PHP stack trace for every query. Disabled by default; enable
        # only when actively debugging which controller issued a query.
        profiling_collect_backtrace: false
        use_savepoints: true
        options:
            1002: "SET time_zone = '+01:00'"
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        # Cache compiled DQL→SQL and metadata in dev too (cheap, big win on pages with
        # many repeat queries like dashboards). Run `php bin/console cache:clear` if
        # you change entity attributes and don't see them reflected.
        query_cache_driver:
            type: pool
            pool: doctrine.system_cache_pool
        metadata_cache_driver:
            type: pool
            pool: doctrine.system_cache_pool
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

framework:
    cache:
        pools:
            doctrine.system_cache_pool:
                adapter: cache.system

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
